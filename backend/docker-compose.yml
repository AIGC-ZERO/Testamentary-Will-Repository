services:
  postgres:
    image: postgres:16-alpine
    container_name: will-demo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: will
      POSTGRES_PASSWORD: will_dev_password
      POSTGRES_DB: will_repository
    volumes:
      - will_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U will -d will_repository"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: will-demo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - full

volumes:
  will_pg_data:
